<!doctype html>
<html lang="zh-CN">

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23171717'/%3E%3Ctext x='50' y='58' font-size='50' text-anchor='middle' fill='%23f59e0b'%3E%26%23x26a1;%3C/text%3E%3C/svg%3E" />
    <script>
      (function () {
        try {
          const stored = localStorage.getItem('theme');
          const theme = stored === 'dark' || stored === 'light' ? stored : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.classList.toggle('dark', theme === 'dark');
        } catch (e) {}
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
